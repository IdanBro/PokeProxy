hmac:
  encryptedValue: CHANGEME

ingress:
  enabled: true
  className: traefik
  bodyLimit:
    enabled: true
    maxBytes: 1048576
    provider: traefik

networkPolicy:
  enabled: true

monitoring:
  enabled: false
  # Prometheus's own scrape default is 30s; 15s here trades a bit more
  # scrape volume for a dashboard/alert that reacts within one 5m rate()
  # window sooner. Independent of the app's own liveness/readiness
  # periodSeconds, which govern kubelet health checks, not metrics scraping.
  scrapeInterval: 15s
  scrapeTimeout: 10s
  # PokeProxyHighServerErrorRate's `for:` duration (plan default 10m -- must
  # exceed the retry budget and a normal rolling deploy by orders of
  # magnitude). Exposed as a value so a live-fire drill can shorten it
  # (--set monitoring.highErrorRateFor=1m) without hand-editing the rule,
  # then restore the real value afterward.
  highErrorRateFor: 10m

e2e:
  enabled: false
  image:
    repository: pokeproxy-e2e
    tag: CHANGEME
    digest: ""
    pullPolicy: IfNotPresent
  proxyUrl: http://traefik.kube-system.svc.cluster.local:80/stream
  # Traefik Service port 80 maps to its container's "web" entrypoint on 8000.
  # NetworkPolicy enforcement matches the pod's real listening port, not the
  # Service port a client dials, so this must track Traefik's actual port.
  traefikContainerPort: 8000
  timeoutSeconds: 10
  retries: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

components:
  pokeproxy:
    enabled: true
    serviceAccount:
      create: true
    replicaCount: 2
    port: 8000
    image:
      repository: pokeproxy
      tag: CHANGEME
      digest: ""
      pullPolicy: IfNotPresent
    probes:
      startup:
        periodSeconds: 1
        failureThreshold: 60
      liveness:
        path: /health
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        path: /ready
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env:
      logLevel: INFO
      forwardMaxAttempts: "3"
      forwardDeadlineSeconds: "10.0"
      forwardAttemptTimeoutSeconds: "3.0"
      redisConnectTimeoutSeconds: "2.0"
      redisSocketTimeoutSeconds: "2.0"
      cacheTtlSeconds: "300"
    rules:
      - reason: strong fire pokemon
        match: ["type_one==Fire", "attack>80", "generation<4"]
      - reason: legendary pokemon
        match: ["legendary==true"]
      - reason: tanky pokemon
        match: ["defense>100", "hit_points>80"]

  mock-downstream:
    enabled: true
    serviceAccount:
      create: true
    port: 8001
    image:
      repository: mock-downstream
      tag: CHANGEME
      digest: ""
      pullPolicy: IfNotPresent
    probes:
      startup:
        periodSeconds: 1
        failureThreshold: 60
      liveness:
        path: /health
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        path: /health
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  redis:
    enabled: true
    serviceAccount:
      create: true
    port: 6379
    image:
      repository: redis
      tag: 7-alpine
      pullPolicy: IfNotPresent
    maxMemoryMb: 128
    probes:
      startup:
        periodSeconds: 1
        failureThreshold: 60
      liveness:
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 192Mi
