{{- $spec := .Values.components.pokeproxy }}
{{- $eFullname := include "pokeproxy.component.fullname" (dict "context" $ "component" "e2e") }}
{{- if and $spec.enabled .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pokeproxy.component.fullname" (dict "context" $ "component" "pokeproxy") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pokeproxy.component.labels" (dict "context" $ "component" "pokeproxy") | nindent 4 }}
spec:
  groups:
    - name: pokeproxy
      rules:
        - alert: PokeProxyHighServerErrorRate
          expr: |
            sum(rate(pokeproxy_requests_total{status=~"5.."}[5m]))
              / sum(rate(pokeproxy_requests_total[5m])) > 0.05
            and sum(rate(pokeproxy_requests_total[5m])) > 0.1
          for: {{ .Values.monitoring.highErrorRateFor }}
          labels:
            severity: critical
            namespace: {{ .Release.Namespace }}
            service: pokeproxy
          annotations:
            summary: "PokeProxy server error rate above 5% for {{ .Values.monitoring.highErrorRateFor }}"
            description: >-
              More than 5% of requests are returning 5xx -- outcome
              internal_error, downstream_error, downstream_timeout or
              downstream_response_too_large, or a downstream_non_2xx that
              relayed downstream's own 5xx. Sustained past the retry budget
              and a normal rolling deploy: not a single blip, this has held
              for the full `for:` window. Check
              pokeproxy_downstream_requests_total{result!="success"} by rule
              and pod logs for the outcome/status breakdown.
        - alert: PokeProxyCacheBackendErrors
          expr: sum(rate(pokeproxy_cache_operations_total{result="error"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
            service: pokeproxy
          annotations:
            summary: "PokeProxy cache backend (Redis) returning errors"
            description: >-
              cache.py treats a RedisError as a cache miss by design, so
              that Redis cannot gate readiness -- which makes a dead Redis
              silent everywhere except this metric. The service is still
              serving correctly, just without dedup -- downstream load may
              be multiplying by the duplicate ratio. Check the redis pod.
        - alert: PokeProxyTargetsDown
          expr: absent(up{job="pokeproxy"} == 1)
          for: 5m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace }}
            service: pokeproxy
          annotations:
            summary: "No healthy PokeProxy scrape targets"
            description: >-
              Every ratio alert above is silent when there are zero scrape
              targets -- a crashed pod emits nothing. This fires when
              Prometheus cannot find any pokeproxy target reporting up=1,
              which the ratio-based alerts structurally cannot detect on
              their own.
{{- if .Values.e2e.enabled }}
        - alert: PokeProxyPostDeployVerificationFailed
          expr: kube_job_status_failed{namespace="{{ .Release.Namespace }}", job_name="{{ $eFullname }}", condition="true"} > 0
          for: 5m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace }}
            service: pokeproxy
          annotations:
            summary: "PokeProxy post-deploy E2E verification job failed"
            description: >-
              The post-deploy E2E Job ({{ $eFullname }}) that gates every
              rollout reported Failed. Under Argo CD this hook detects, it
              does not roll back automatically -- the last sync may be
              running a functionally broken version right now (see
              deploy/README.md's Verification and Rollback sections). Check
              `kubectl logs job/{{ $eFullname }} -n {{ .Release.Namespace }}`
              for the failed assertion, then `gh workflow run rollback.yml
              -f sha=<last-good-sha>` if a revert is needed. The Job is
              reaped after ttlSecondsAfterFinished=3600, so this alert stops
              firing once it's gone -- read the logs before then.
{{- end }}
{{- end }}
