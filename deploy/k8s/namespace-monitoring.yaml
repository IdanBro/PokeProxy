apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: pokeproxy
    # prometheus-node-exporter runs with hostNetwork, hostPID and hostPath
    # mounts (/proc, /sys) by design, to read real node-level metrics. Both
    # the `baseline` and `restricted` Pod Security Standards forbid all three,
    # so this namespace is a deliberate, scoped exception to the `restricted`
    # posture the pokeproxy namespace enforces -- not a default left unset.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
