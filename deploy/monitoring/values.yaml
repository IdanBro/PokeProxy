# Values for prometheus-community/kube-prometheus-stack, trimmed for a
# single-node laptop k3d cluster (Part 4 plan D8). Installed imperatively by
# scripts/install-monitoring.sh, called from the Tiltfile locally and from
# scripts/bootstrap-prod.sh for prod -- not an Argo-managed Application (D6).
#
# App-side scrape/alert/dashboard objects (ServiceMonitor, PrometheusRule,
# dashboard ConfigMap) do NOT live here -- they live in the app's own Helm
# chart under `monitoring.enabled` (D7), reconciled by Argo in prod.

fullnameOverride: kube-prometheus-stack

# k3s doesn't expose kube-apiserver/controller-manager/scheduler/proxy/etcd
# the way this chart's default scrape configs expect (kubeadm-style static
# pods on fixed host ports). Left enabled, every one of these is a
# permanently-down target and a source of noisy default alerts for
# components that were never actually reachable.
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

prometheus:
  # Ingress deliberately NOT enabled (A-3). Prometheus's read API has no
  # auth of its own in this chart -- an Ingress here would put
  # /api/v1/query, /api/v1/status/config (full scrape config incl. internal
  # topology) and the /-/reload lifecycle endpoint on the open internet
  # unauthenticated, confirmed live (all 200 through the ingress before this
  # was reverted). Same disclosure class docs/issues/025 was just written to
  # close for the app's own /stats -- would reopen it one layer up, and
  # bootstrap-prod.sh loads this same file so it'd land in prod too. D4
  # already keeps the app's own /metrics off the Ingress for the identical
  # reason; port-forward (deploy/README.md) is the access path, consistent
  # with that precedent rather than a new exception. Considered a Traefik
  # BasicAuth middleware instead (precedent: helm/pokeproxy/templates/
  # pokeproxy/traefik-middleware.yaml) -- rejected as more moving parts
  # (separate Middleware + Secret + IngressRoute objects for a second,
  # separately-installed Helm release) for a laptop-only dev convenience
  # that port-forward already covers with zero extra surface.
  ingress:
    enabled: false
  prometheusSpec:
    retention: 6h
    # No storageSpec set -> Prometheus Operator falls back to an emptyDir.
    # Metrics don't survive a pod restart; the accepted laptop trade-off (D8).
    #
    # Selector*NilUsesHelmValues: false so Prometheus watches ServiceMonitor/
    # PodMonitor/PrometheusRule/Probe objects across all releases and
    # namespaces, not only ones carrying this release's own label. The app
    # chart's ServiceMonitor/PrometheusRule (D7, separate Helm release) rely
    # on this to be picked up at all.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  # Kept enabled (D9) -- the assignment's alert needs to be observably able
  # to fire, not just defined.
  alertmanagerSpec:
    retention: 6h
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

grafana:
  # Path-based ingress on the same host-less Traefik rule pattern the app's
  # own Ingress uses (deploy/helm/pokeproxy/templates/pokeproxy/ingress.yaml
  # -- no `host:`, matches whatever hostname the client used). `hosts: []`
  # renders that host-less rule; the chart's own doc comment says hosts
  # "must be provided", but the rendered template (verified via `helm
  # template`) produces a valid rule with none, same as the app's ingress.
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    hosts: []
  # serve_from_sub_path + a root_url ending in the same /grafana/ path is
  # what makes Grafana generate its own asset/API links correctly under the
  # ingress path instead of `/` -- without it the UI loads but every asset
  # 404s. domain/root_url are set for correct sub-path parsing, not for
  # exact link generation: this file is shared verbatim between dev (port
  # 8080) and prod (port 8081) via install-monitoring.sh, called from both
  # the Tiltfile and bootstrap-prod.sh, so no single port is correct for
  # both -- acceptable, since nothing here does OAuth/email that would need
  # an exact absolute URL.
  #
  # Fixed dev-only admin password (A-2, Part 5 audit 2026-08-25). Without
  # this the subchart's `randAlphaNum` mints a new password on every `helm
  # upgrade`, changing the admin Secret and rolling the Grafana Deployment
  # on every idempotent `make up` re-run even when nothing else changed.
  # Not a security boundary -- this is a laptop dev cluster, and the Grafana
  # chart's own post-install NOTES print the `kubectl get secret ...`
  # command to read whatever admin password is set, fixed or random.
  adminPassword: "pokeproxy-dev"
  grafana.ini:
    server:
      domain: localhost
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
    dashboards:
      # Sidecar's dashboard folder, confirmed live from the running
      # container's env (FOLDER=/tmp/dashboards); PokeProxy Overview is
      # provisioned there as pokeproxy-overview.json (A-8). Without this,
      # Grafana lands the on-call on a 25-dashboard root-folder search page.
      default_home_dashboard_path: /tmp/dashboards/pokeproxy-overview.json
  # The chart's own Grafana ServiceMonitor scrapes plain `/metrics` by
  # default; serve_from_sub_path above makes Grafana 301 that to
  # http://localhost/grafana/metrics, so without this the target is
  # permanently `down` (connection refused) and TargetDown fires forever --
  # confirmed live (A-2). The Prometheus subchart derives its own scrape
  # path from routePrefix automatically; the Grafana subchart does not.
  serviceMonitor:
    path: /grafana/metrics
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  # 192Mi OOMKilled the grafana container in practice (exit 137, restart-looped)
  # under real dashboard-loading load; `kubectl top pod` showed ~145Mi resident
  # even before it stabilized. 384Mi verified stable -- see WORKLOG/step-3 report.
  # persistence left at chart default (disabled -> emptyDir). Dashboards ship
  # as ConfigMaps (D7, step 5) and get reloaded by the chart's own sidecar;
  # nothing here needs to survive a pod restart.
  sidecar:
    # The two k8s-sidecar containers (dashboard + datasource reload) had no
    # resource caps at all under chart defaults -- ~76Mi and ~72Mi resident
    # each in practice, unbounded. Capped explicitly, in keeping with D8.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  # hostNetwork/hostPID/hostPath (this subchart's defaults, left as-is) are
  # why the monitoring namespace carries the `privileged` PSA label -- see
  # deploy/k8s/namespace-monitoring.yaml.
