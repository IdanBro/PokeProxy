global:
  domain: argocd.localhost

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 30s

server:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    # hostname defaults to global.domain (argocd.localhost); tls stays false
    # to match server.insecure above -- no self-signed cert to trust locally

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0
