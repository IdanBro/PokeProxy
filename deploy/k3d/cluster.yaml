apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: pokeproxy
servers: 1
agents: 0
image: rancher/k3s:v1.35.5-k3s1
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: pokeproxy-registry
    host: "0.0.0.0"
    hostPort: "5000"
options:
  k3d:
    wait: true
    timeout: "120s"
