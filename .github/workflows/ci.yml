name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
          cache-suffix: lint
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
          cache-suffix: test
      - run: uv sync --locked
      - run: uv run pytest -q

  chart-lint:
    name: Chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - run: helm lint --strict deploy/helm/pokeproxy -f deploy/envs/local/values.yaml --set e2e.enabled=true --set e2e.image.tag=test
      - run: |
          helm template pokeproxy deploy/helm/pokeproxy \
            -f deploy/envs/local/values.yaml \
            --set e2e.enabled=true --set e2e.image.tag=test \
            -n pokeproxy \
          | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.5 -summary
      - run: helm lint --strict deploy/helm/pokeproxy -f deploy/envs/prod/values.yaml
      - run: |
          helm template pokeproxy deploy/helm/pokeproxy \
            -f deploy/envs/prod/values.yaml \
            -n pokeproxy \
          | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.5 -summary

  build-pokeproxy:
    name: Build pokeproxy
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sha
        run: |
          full="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/idanbro/pokeproxy:${{ steps.sha.outputs.short }}
          build-args: GIT_SHA=${{ steps.sha.outputs.full }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=pokeproxy
          cache-to: type=gha,mode=max,scope=pokeproxy
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/idanbro/pokeproxy@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: app/.trivyignore
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/idanbro/pokeproxy@${{ steps.build.outputs.digest }}

  build-mock-downstream:
    name: Build mock-downstream
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sha
        run: |
          full="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app
          file: app/Dockerfile.mock
          platforms: linux/amd64
          push: true
          tags: ghcr.io/idanbro/mock-downstream:${{ steps.sha.outputs.short }}
          build-args: GIT_SHA=${{ steps.sha.outputs.full }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=mock-downstream
          cache-to: type=gha,mode=max,scope=mock-downstream
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/idanbro/mock-downstream@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: app/.trivyignore
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/idanbro/mock-downstream@${{ steps.build.outputs.digest }}

  build-e2e:
    name: Build e2e
    needs: [build-pokeproxy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sha
        run: |
          full="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app
          file: app/Dockerfile.e2e
          platforms: linux/amd64
          push: true
          tags: ghcr.io/idanbro/pokeproxy-e2e:${{ steps.sha.outputs.short }}
          build-args: BASE_IMAGE=ghcr.io/idanbro/pokeproxy@${{ needs.build-pokeproxy.outputs.digest }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=pokeproxy-e2e
          cache-to: type=gha,mode=max,scope=pokeproxy-e2e
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/idanbro/pokeproxy-e2e@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: app/.trivyignore
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/idanbro/pokeproxy-e2e@${{ steps.build.outputs.digest }}

  promote:
    name: Promote
    needs: [build-pokeproxy, build-mock-downstream, build-e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      contents: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Write image tags and digests
        env:
          VALUES_FILE: deploy/envs/prod/values.yaml
          SHORT: ${{ steps.sha.outputs.short }}
          POKEPROXY_DIGEST: ${{ needs.build-pokeproxy.outputs.digest }}
          MOCK_DOWNSTREAM_DIGEST: ${{ needs.build-mock-downstream.outputs.digest }}
          E2E_DIGEST: ${{ needs.build-e2e.outputs.digest }}
        run: |
          yq -i '
            .components.pokeproxy.image.tag = strenv(SHORT) |
            .components.pokeproxy.image.digest = strenv(POKEPROXY_DIGEST) |
            .components["mock-downstream"].image.tag = strenv(SHORT) |
            .components["mock-downstream"].image.digest = strenv(MOCK_DOWNSTREAM_DIGEST) |
            .e2e.image.tag = strenv(SHORT) |
            .e2e.image.digest = strenv(E2E_DIGEST)
          ' "$VALUES_FILE"
          git diff "$VALUES_FILE"
      - name: Commit and push
        env:
          SHORT: ${{ steps.sha.outputs.short }}
          POKEPROXY_DIGEST: ${{ needs.build-pokeproxy.outputs.digest }}
          MOCK_DOWNSTREAM_DIGEST: ${{ needs.build-mock-downstream.outputs.digest }}
          E2E_DIGEST: ${{ needs.build-e2e.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/envs/prod/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to promote (image references already at $SHORT)."
            exit 0
          fi
          git commit -m "chore(deploy): promote $SHORT" -m "pokeproxy@$POKEPROXY_DIGEST" -m "mock-downstream@$MOCK_DOWNSTREAM_DIGEST" -m "pokeproxy-e2e@$E2E_DIGEST"
          git pull --rebase origin main
          git push origin HEAD:main
