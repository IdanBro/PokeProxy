name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A cancelled run on main could cancel a promote job mid-push. PRs and
  # workflow_dispatch stay cancel-on-superseded; main only ever appends commits,
  # so a run there is left to finish rather than raced against the next one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
          cache-suffix: lint
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
          cache-suffix: test
      - run: uv sync --locked
      - run: uv run pytest -q

  chart-lint:
    name: Chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kubeconform
        uses: ./.github/actions/setup-kubeconform
      - run: helm lint --strict deploy/helm/pokeproxy -f deploy/envs/local/values.yaml --set e2e.enabled=true --set e2e.image.tag=test
      - run: |
          helm template pokeproxy deploy/helm/pokeproxy \
            -f deploy/envs/local/values.yaml \
            --set e2e.enabled=true --set e2e.image.tag=test \
            -n pokeproxy \
          | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.5 -summary
      - run: helm lint --strict deploy/helm/pokeproxy -f deploy/envs/prod/values.yaml
      - run: |
          helm template pokeproxy deploy/helm/pokeproxy \
            -f deploy/envs/prod/values.yaml \
            -n pokeproxy \
          | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.5 -summary

  build-pokeproxy:
    name: Build pokeproxy
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        uses: ./.github/actions/build-image
        with:
          image: idanbro/pokeproxy
          dockerfile: app/Dockerfile
          build-args: GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-scope: pokeproxy
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  build-mock-downstream:
    name: Build mock-downstream
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        uses: ./.github/actions/build-image
        with:
          image: idanbro/mock-downstream
          dockerfile: app/Dockerfile.mock
          build-args: GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-scope: mock-downstream
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  build-e2e:
    name: Build e2e
    needs: [build-pokeproxy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        uses: ./.github/actions/build-image
        with:
          image: idanbro/pokeproxy-e2e
          dockerfile: app/Dockerfile.e2e
          build-args: BASE_IMAGE=ghcr.io/idanbro/pokeproxy@${{ needs.build-pokeproxy.outputs.digest }}
          cache-scope: pokeproxy-e2e
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  promote:
    name: Promote
    needs: [chart-lint, build-pokeproxy, build-mock-downstream, build-e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: promote
      cancel-in-progress: false
    permissions:
      contents: write
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.PROMOTE_PUSH_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Write image tags and digests
        uses: ./.github/actions/write-image-refs
        with:
          values-file: deploy/envs/prod/values.yaml
          tag: ${{ steps.sha.outputs.short }}
          pokeproxy-digest: ${{ needs.build-pokeproxy.outputs.digest }}
          mock-downstream-digest: ${{ needs.build-mock-downstream.outputs.digest }}
          e2e-digest: ${{ needs.build-e2e.outputs.digest }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kubeconform
        uses: ./.github/actions/setup-kubeconform
      - name: Validate the promoted values file before committing
        run: |
          helm lint --strict deploy/helm/pokeproxy -f deploy/envs/prod/values.yaml
          helm template pokeproxy deploy/helm/pokeproxy \
            -f deploy/envs/prod/values.yaml \
            -n pokeproxy \
          | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.5 -summary
      - name: Commit and push
        env:
          SHORT: ${{ steps.sha.outputs.short }}
          POKEPROXY_DIGEST: ${{ needs.build-pokeproxy.outputs.digest }}
          MOCK_DOWNSTREAM_DIGEST: ${{ needs.build-mock-downstream.outputs.digest }}
          E2E_DIGEST: ${{ needs.build-e2e.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/envs/prod/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to promote (image references already at $SHORT)."
            exit 0
          fi
          git commit -m "chore(deploy): promote $SHORT [skip ci]" -m "pokeproxy@$POKEPROXY_DIGEST" -m "mock-downstream@$MOCK_DOWNSTREAM_DIGEST" -m "pokeproxy-e2e@$E2E_DIGEST"
          git pull --rebase origin main
          git push origin HEAD:main
