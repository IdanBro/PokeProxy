name: Build, scan, and sign image
description: Build a container image, push to the registry, scan it with Trivy, and sign it with cosign.

inputs:
  image:
    description: Image repository path under the registry, e.g. idanbro/pokeproxy
    required: true
  dockerfile:
    description: Path to the Dockerfile, relative to the repo root
    required: true
  build-args:
    description: Build args passed through to docker/build-push-action
    required: false
    default: ""
  cache-scope:
    description: GHA cache scope for this image
    required: true
  registry:
    description: Container registry host
    required: false
    default: ghcr.io
  registry-username:
    description: Username for registry login
    required: true
  registry-token:
    description: Token/password for registry login
    required: true

outputs:
  digest:
    description: Digest of the pushed image
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - id: sha
      shell: bash
      run: |
        full="${{ github.event.pull_request.head.sha || github.sha }}"
        echo "full=$full" >> "$GITHUB_OUTPUT"
        echo "short=${full:0:7}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: app
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: ${{ inputs.registry }}/${{ inputs.image }}:${{ steps.sha.outputs.short }}
        build-args: ${{ inputs.build-args }}
        sbom: true
        provenance: mode=max
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - shell: bash
      run: cosign sign --yes ${{ inputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
